[server]
host = "127.0.0.1"
port = 3000

[database]
url = "postgres://admin:admin@localhost/gridstack"

[authenification]
allow_registration = true
access_token_expiry_seconds = 3600
refresh_token_expiry_seconds = 7776000
# openssl rand -hex 64
json_web_token_secret = "f4351c639741bdfc82fa19560c3c4c8866828384b7448dff20b797d8e598a6b3a6bedc11d69b3f6cfc35f1a7659c80b28890edd4c03e0a8e102e352a28ed1e44"
# openssl rand -hex 16
password_pepper = "45590a614fff689504f123c3add6ad36"

# Optional appservice authentication/namespace ownership.
# `controlled_user_id_patterns` are Rust regex strings evaluated against full MXID.
# Example:
# [[authenification.appservices]]
# id = "com.example.bridge"
# as_token = "bridge-shared-secret"
# sender_localpart = "bridgebot"
# controlled_user_id_patterns = ["^@_bridge_.*:127\\.0\\.0\\.1:3000$"]

[rate_limit]
retry_after_ms = 2000

[identity]
# Primary long-term key material for identity endpoints.
# If either public/private key is missing, bootstrap falls back to loading from DB
# and generates once only when DB has no long-term key yet.
# Recommended generation (URL-safe unpadded base64, 32 bytes entropy each):
#   ID_PUBLIC_KEY="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"
#   ID_PRIVATE_KEY="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"
# Then set:
#   long_term_public_key = "$ID_PUBLIC_KEY"
#   long_term_private_key = "$ID_PRIVATE_KEY"
#
# Operational guidance:
# - Generate once and keep stable across restarts/deployments.
# - Store in secret management, not in git.
# - Rotate intentionally (do not auto-regenerate on startup).
long_term_key_id = "ed25519:0"
long_term_public_key = "VXuGitF39UH5iRfvbIknlvlAVKgD1BsLDMvBf0pmp7c"
long_term_private_key = "dGhpc19pc19hX3BsYWNlaG9sZGVyX2tleV9mb3JfZGV2X29ubHk"

# Ephemeral invite key validity window in seconds (default: 7 days).
ephemeral_key_validity_seconds = 604800
