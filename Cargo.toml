[package]
name = "gridstack"
authors = ["Dmustache <dvusakov@gmail.com>"]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }

axum = { version = "0.8.8", features = ["macros", "json", "multipart"] }

http = "1.4.0"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
syn = { version = "2.0.117", features = ["full", "parsing"] }
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
utoipa = "5.4.0"

diesel = { version = "2.3.5", features = ["postgres", "chrono", "serde_json", "uuid", "r2d2"] }

anyhow = "1.0.100"
thiserror = "2.0.17"
regex = "1.12.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tower-http = { version = "0.6.6", features = ["trace"] }

config = "0.15.22"

strum = { version = "0.28", features = ["derive"]}
response_derive = { path = "response_derive" }
jsonwebtoken = "9.3.1"
argon2 = "0.5.3"
base64 = "0.22.1"

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
