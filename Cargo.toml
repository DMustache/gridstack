[workspace.package]
name = "gridstack"
authors = ["Dmustache <dvusakov@gmail.com>"]
rust-version = "1.92.0"

[workspace]
resolver = "3"
members = ["api", "macro_utilities", "models", "persistence", "server", "utilities"]

[workspace.dependencies]
utilities = { path = "utilities"}
macro_utilities = { path = "macro_utilities" }
models = { path = "models" }
persistence = { path = "persistence" }

# Core Async & Runtime
tokio = { version = "1.49.0", features = ["full"] }
async-trait = "0.1.89"

# Web Framework & HTTP
axum = { version = "0.8.8", features = ["macros", "json", "multipart"] }
axum-extra = { version = "0.12.5", features = ["cookie", "query"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.8", features = ["cors"] }
http = "1.4.0"
http-body = "1.0.1"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["full"] }
hyper-util = { version = "0.1.19", features = ["client", "http1", "http2"] }
hyper-tls = "0.6.0"

# Serialization & Data
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
serde_html_form = "0.4.0"
uuid = { version = "1.19.0", features = ["v4", "v7", "serde"] }
bytes = "1.11.0"
urlencoding = "2.1.3"

# Database & Persistence
diesel = { version = "2.3.5", features = ["postgres", "sqlite", "chrono", "serde_json", "uuid"] }
diesel-async = { version = "0.7.4", features = ["postgres", "sqlite"] }
bb8 = "0.9.1"
deadpool = "0.12.3"
diesel-derive-enum = { version = "2.1.0", features = ["postgres"] }
deadpool-diesel = { version = "0.6.1", features = ["postgres"] }
diesel_migrations = { version = "2.3.1", features = ["postgres"] }

# Error Handling & Logic
anyhow = "1.0.100"
thiserror = "2.0.17"
validator = { version = "0.20.0", features = ["derive"] }
regex = "1.12.2"
lazy_static = "1.5.0"

# Time & Localization
chrono = { version = "0.4.42", features = ["serde"] }

# Security & Crypto
rand = "0.9.2"
ring = "0.17.14"
base64 = "0.22.1"
sha2 = "0.10.9"
ammonia = "4.1.2"
argon2 = "0.5.3"

# Observability
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono", "uuid"] }

# Configuration & CLI
config = "0.15.19"
toml = "0.9.8"
clap = { version = "4.5.54", features = ["derive"] }

# Constants
const_format = "0.2.35"

# Specialized / Matrix
ruma = { git = "https://github.com/matrix-construct/ruma", features = [
    "client-api",
    "rand",
    "canonical-json",
    "events"
] }


# Plugins
libloading = "0.9.0"
linkme = "0.3.35"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["proc-macro", "parsing"] }
