[server]
host = "127.0.0.1"
port = 3000
server_name = "127.0.0.1:3000"

[database]
# env: GRIDSTACK__DATABASE__URL
url = ""

[authenification]
allow_registration = true
access_token_expiry_seconds = 3600
refresh_token_expiry_seconds = 7776000
# openssl rand -hex 64
# env: GRIDSTACK__AUTHENIFICATION__JSON_WEB_TOKEN_SECRET (>= 32 bytes)
json_web_token_secret = ""
# openssl rand -hex 16
# env: GRIDSTACK__AUTHENIFICATION__PASSWORD_PEPPER (>= 32 bytes)
password_pepper = ""

# Optional appservice authentication/namespace ownership.
# `controlled_user_id_patterns` are Rust regex strings evaluated against full MXID.
# Example:
# [[authenification.appservices]]
# id = "com.example.bridge"
# as_token = "bridge-shared-secret"
# sender_localpart = "bridgebot"
# controlled_user_id_patterns = ["^@_bridge_.*:127\\.0\\.0\\.1:3000$"]

[rate_limit]
retry_after_ms = 2000

[sync]
# env: GRIDSTACK__SYNC__MAXIMUM_TIMEOUT_MILLISECONDS
maximum_timeout_milliseconds = 30000

[identity]
# Primary long-term ed25519 key for identity endpoints.
# Only the private seed is configured; the public key is derived from it.
# If missing, bootstrap loads the key from the DB and generates one once when none exists.
# Generate a 32-byte seed (unpadded standard base64):
#   ID_SEED="$(openssl rand -base64 32 | tr -d '=')"
#   long_term_private_key = "$ID_SEED"
# long_term_public_key is no longer accepted.
#
# Operational guidance:
# - Generate once and keep stable across restarts/deployments.
# - Store in secret management, not in git.
long_term_key_id = "ed25519:0"
# env: GRIDSTACK__IDENTITY__LONG_TERM_PRIVATE_KEY
# long_term_private_key = ""

# Ephemeral invite key validity window in seconds (default: 7 days).
ephemeral_key_validity_seconds = 604800
